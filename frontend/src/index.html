<!doctype html>
<!-- `lang` is the DEFAULT_LOCALE of core/i18n/locale.ts; the script below and
     then I18nService correct it to the language actually rendered. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>JobQuest</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!--
    Runs before first paint, so a dark-mode user never gets a white flash and a
    screen reader never announces the wrong language while Angular boots. Keep
    the storage keys and the locale list in sync with core/theme.service.ts and
    core/i18n/locale.ts, which own both preferences from bootstrap onwards.
    Add the RTL handling here too on the day an RTL locale ships — today
    directionOf() is ltr for every locale, so setting `dir` would be dead code.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var stored = localStorage.getItem('jobquest.theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {
        /* Storage or matchMedia unavailable: light is a safe first paint. */
      }
      try {
        var supported = ['fr', 'en', 'de', 'es'];
        // Storage is user-writable, so the value is matched against the
        // allowlist rather than written to the DOM as-is.
        var candidates = [localStorage.getItem('jobquest.locale') || ''].concat(
          navigator.languages || [navigator.language || ''],
        );
        for (var i = 0; i < candidates.length; i++) {
          var primary = String(candidates[i]).toLowerCase().split('-')[0];
          if (supported.indexOf(primary) !== -1) {
            root.setAttribute('lang', primary);
            break;
          }
        }
      } catch (e) {
        /* Storage unavailable: the static lang above is the product default. */
      }
    })();
  </script>
  <!--
    Fonts are self-hosted (public/fonts, generated by scripts/fetch-fonts.mjs):
    no visitor IP reaches Google. Only the two families used above the fold are
    preloaded, and only their latin subset — latin-ext loads on demand through
    its unicode-range. `crossorigin` is required even same-origin, otherwise the
    preload is discarded and the file fetched twice.
  -->
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/fraunces-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <app-root></app-root>
</body>
</html>
