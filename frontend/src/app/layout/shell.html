<div class="min-h-screen md:grid md:grid-cols-[264px_1fr]">
  <!-- Sidebar (desktop) -->
  <aside
    class="sticky top-0 hidden h-screen flex-col justify-between border-r border-slate-200 bg-white px-5 py-6 md:flex"
  >
    <div>
      <a routerLink="/" class="flex items-center gap-2.5 px-2">
        <span
          class="grid h-9 w-9 place-items-center rounded-xl bg-brand-600 text-lg font-black text-white shadow-sm shadow-brand-600/30"
          >J</span
        >
        <span class="text-lg font-bold tracking-tight text-slate-900">JobQuest</span>
      </a>

      <nav class="mt-9 flex flex-col gap-1">
        @for (item of nav; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-brand-50 text-brand-700 font-semibold"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900"
          >
            <span class="w-4 text-center text-base">{{ item.icon }}</span>
            {{ item.label }}
          </a>
        }
      </nav>
    </div>

    <div class="flex flex-col gap-1 border-t border-slate-100 pt-4">
      <button
        (click)="logout()"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-rose-500"
      >
        <span class="w-4 text-center text-base">⎋</span>
        Se déconnecter
      </button>
      <a
        routerLink="/profile"
        class="-m-1.5 flex min-w-0 items-center gap-3 rounded-lg p-1.5 transition-colors hover:bg-slate-50"
      >
        @if (avatarUrl(); as url) {
          <img
            [src]="url"
            alt="Photo de profil"
            class="h-9 w-9 shrink-0 rounded-full object-cover"
          />
        } @else {
          <span
            class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-brand-100 text-xs font-bold text-brand-700"
            >{{ initials() }}</span
          >
        }
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-slate-800">{{ displayName() }}</p>
          <span class="text-xs font-medium text-slate-400">Voir le profil</span>
        </div>
      </a>
    </div>
  </aside>

  <!-- Top bar (mobile) -->
  <header
    class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-200 bg-white/90 px-4 py-3 backdrop-blur md:hidden"
  >
    <a routerLink="/" class="flex items-center gap-2">
      <span
        class="grid h-8 w-8 place-items-center rounded-lg bg-brand-600 text-sm font-black text-white"
        >J</span
      >
      <span class="font-bold tracking-tight">JobQuest</span>
    </a>
    <div class="flex items-center gap-1">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-brand-50 text-brand-700"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-600"
          >{{ item.icon }}</a
        >
      }
      <button
        (click)="logout()"
        class="ml-1 rounded-lg px-2 py-1.5 text-sm font-medium text-slate-400 hover:text-rose-500"
      >
        ⎋
      </button>
    </div>
  </header>

  <main class="px-5 py-7 md:px-10 md:py-9">
    <router-outlet />
  </main>
</div>
