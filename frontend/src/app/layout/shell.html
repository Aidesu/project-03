<div class="min-h-screen md:grid md:grid-cols-[264px_1fr]">
  <!-- Sidebar (desktop) -->
  <aside
    class="sticky top-0 hidden h-screen flex-col justify-between border-r border-slate-200 bg-surface px-5 py-6 md:flex"
  >
    <div>
      <a routerLink="/" class="flex items-center gap-2.5 px-2">
        <span
          class="grid h-9 w-9 place-items-center rounded-xl bg-brand-600 text-lg font-black text-white shadow-sm shadow-brand-600/30"
          >J</span
        >
        <span class="text-lg font-bold tracking-tight text-slate-900">JobQuest</span>
      </a>

      <nav class="mt-9 flex flex-col gap-1">
        @for (item of nav; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-brand-50 text-brand-700 font-semibold dark:bg-brand-500/15 dark:text-brand-200"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900"
          >
            <span class="w-4 text-center text-base">{{ item.icon }}</span>
            {{ t(item.labelKey) }}
          </a>
        }
      </nav>
    </div>

    <div class="flex flex-col gap-3 border-t border-slate-100 pt-4">
      <!-- Same padding grid as the nav rows above, so the flag column lines up
           with their icon column. Opens upward: it sits at the viewport floor. -->
      <app-theme-switch variant="nav" />
      <app-language-switcher variant="nav" placement="top-start" />
      <button
        (click)="logout()"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-rose-500"
      >
        <span class="w-4 text-center text-base">⎋</span>
        {{ t('shell.logout') }}
      </button>
      <a
        routerLink="/profile"
        class="-m-1.5 flex min-w-0 items-center gap-3 rounded-lg p-1.5 transition-colors hover:bg-slate-50"
      >
        @if (avatarUrl(); as url) {
          <img
            [src]="url"
            [alt]="t('shell.avatarAlt')"
            class="h-9 w-9 shrink-0 rounded-full object-cover"
          />
        } @else {
          <span
            class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-brand-100 text-xs font-bold text-brand-700"
            >{{ initials() }}</span
          >
        }
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-slate-800">{{ displayName() }}</p>
          <span class="text-xs font-medium text-slate-400">{{ t('shell.viewProfile') }}</span>
        </div>
      </a>
    </div>
  </aside>

  <!-- Top bar (mobile) -->
  <header
    class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-200 bg-surface/90 px-4 py-3 backdrop-blur md:hidden"
  >
    <a routerLink="/" class="flex items-center gap-2">
      <span
        class="grid h-8 w-8 place-items-center rounded-lg bg-brand-600 text-sm font-black text-white"
        >J</span
      >
      <span class="font-bold tracking-tight">JobQuest</span>
    </a>
    <div class="flex items-center gap-1">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-200"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          [attr.aria-label]="t(item.labelKey)"
          class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-600"
          >{{ item.icon }}</a
        >
      }
      <app-theme-switch />
      <app-language-switcher placement="bottom-end" />
      <button
        (click)="logout()"
        [attr.aria-label]="t('shell.logout')"
        class="btn btn--icon btn--ghost ml-1 h-8 w-8 text-slate-400 hover:bg-rose-50 hover:text-rose-500"
      >
        ⎋
      </button>
    </div>
  </header>

  <main class="px-5 py-7 md:px-10 md:py-9">
    <router-outlet />
  </main>
</div>
