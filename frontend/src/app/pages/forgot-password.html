<div class="flex min-h-screen items-center justify-center px-6 py-12">
  <div class="w-full max-w-sm">
    <div class="mb-8 flex justify-end">
      <app-language-switcher placement="bottom-end" />
    </div>

    <h2 class="text-2xl font-bold tracking-tight text-slate-900">
      {{ t('forgotPassword.title') }}
    </h2>

    @if (sent()) {
      <div class="mt-6 alert alert--success">
        {{ t('forgotPassword.sent', { minutes: ttlMinutes }) }}
      </div>
    } @else {
      <p class="mt-1.5 text-sm text-slate-500">{{ t('forgotPassword.subtitle') }}</p>

      @if (error(); as key) {
        <div class="mt-6 alert alert--error">{{ t(key) }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 flex flex-col gap-4">
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium text-slate-700">{{ t('auth.email') }}</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            [placeholder]="t('auth.emailPlaceholder')"
            class="rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
          />
        </label>

        <button type="submit" [disabled]="loading()" class="mt-2 btn btn--primary">
          {{ loading() ? t('forgotPassword.submitting') : t('forgotPassword.submit') }}
        </button>
      </form>
    }

    <p class="mt-6 text-center text-sm text-slate-500">
      <a routerLink="/login" class="font-semibold text-brand-600 hover:text-brand-700">{{
        t('forgotPassword.backToLogin')
      }}</a>
    </p>
  </div>
</div>
