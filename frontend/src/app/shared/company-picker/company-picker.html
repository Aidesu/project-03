<div class="relative">
  <input
    type="text"
    role="combobox"
    autocomplete="off"
    aria-autocomplete="list"
    [attr.id]="inputId() || null"
    [value]="value()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId"
    [attr.aria-activedescendant]="activeOptionId()"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keydown)="onKeydown($event)"
    class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 disabled:bg-slate-50"
  />

  @if (open() && suggestions().length) {
    <ul
      [id]="listId"
      role="listbox"
      class="absolute z-20 mt-1 max-h-64 w-full overflow-y-auto rounded-lg border border-slate-200 bg-surface py-1 shadow-lg"
    >
      @for (company of suggestions(); track company.id; let i = $index) {
        <li
          [id]="listId + '-' + i"
          role="option"
          [attr.aria-selected]="i === activeIndex()"
          (mousedown)="$event.preventDefault()"
          (click)="select(company)"
          class="flex cursor-pointer items-baseline justify-between gap-3 px-3 py-2 hover:bg-slate-100"
          [class]="i === activeIndex() ? 'bg-brand-50 dark:bg-brand-500/15' : ''"
        >
          <span class="truncate text-sm font-medium text-slate-700">{{
            company.name
          }}</span>
          @if (company.location) {
            <span class="shrink-0 truncate text-xs text-slate-400">{{
              company.location
            }}</span>
          }
        </li>
      }
    </ul>
  }
</div>
