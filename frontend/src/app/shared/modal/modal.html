<div
  class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-slate-900/40 p-4 backdrop-blur-sm sm:p-8"
  (click)="closed.emit()"
>
  <!-- Stop propagation so clicks inside the card don't close the dialog. -->
  <div
    role="dialog"
    aria-modal="true"
    class="my-auto w-full max-w-2xl rounded-2xl border border-slate-100 bg-white shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <header class="flex items-center justify-between border-b border-slate-100 px-6 py-4">
      <h2 class="text-base font-semibold text-slate-800">{{ title() }}</h2>
      <button
        type="button"
        (click)="closed.emit()"
        [attr.aria-label]="t('modal.close')"
        class="btn btn--icon btn--ghost h-8 w-8"
      >
        ✕
      </button>
    </header>

    <div class="px-6 py-5">
      <ng-content />
    </div>
  </div>
</div>
