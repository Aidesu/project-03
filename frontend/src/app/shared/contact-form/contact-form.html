<app-modal
  [title]="isEdit ? t('contactForm.editTitle') : t('contactForm.newTitle')"
  (closed)="cancelled.emit()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-slate-700">{{ t('contactForm.firstName') }}</span>
        <input
          type="text"
          formControlName="firstName"
          [placeholder]="t('contactForm.firstNamePlaceholder')"
          class="rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
        />
        @if (form.controls.firstName.touched && form.controls.firstName.invalid) {
          <span class="text-xs text-rose-600">{{ t('contactForm.firstNameRequired') }}</span>
        }
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-slate-700">{{ t('contactForm.lastName') }}</span>
        <input
          type="text"
          formControlName="lastName"
          [placeholder]="t('contactForm.lastNamePlaceholder')"
          class="rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-slate-700">{{ t('contactForm.role') }}</span>
        <input
          type="text"
          formControlName="title"
          [placeholder]="t('contactForm.rolePlaceholder')"
          class="rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-slate-700">{{ t('contactForm.company') }}</span>
        <select
          formControlName="companyId"
          class="rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
        >
          <option value="">{{ t('contactForm.companyNone') }}</option>
          @for (c of companies(); track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
        @if (companiesTruncated()) {
          <span class="text-xs text-slate-400">{{ t('contactForm.companiesTruncated') }}</span>
        }
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-slate-700">{{ t('contactForm.email') }}</span>
        <input
          type="email"
          formControlName="email"
          [placeholder]="t('contactForm.emailPlaceholder')"
          class="rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="text-xs text-rose-600">{{ t('contactForm.emailInvalid') }}</span>
        }
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-slate-700">{{ t('contactForm.phone') }}</span>
        <input
          type="tel"
          formControlName="phone"
          [placeholder]="t('contactForm.phonePlaceholder')"
          class="rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
        />
      </label>
    </div>

    <label class="flex flex-col gap-1.5">
      <span class="text-sm font-medium text-slate-700">{{ t('contactForm.linkedin') }}</span>
      <input
        type="text"
        formControlName="linkedinUrl"
        [placeholder]="t('contactForm.linkedinPlaceholder')"
        class="rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-sm font-medium text-slate-700">{{ t('contactForm.notes') }}</span>
      <textarea
        formControlName="notes"
        rows="4"
        [placeholder]="t('contactForm.notesPlaceholder')"
        class="resize-y rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
      ></textarea>
      <span class="text-xs text-slate-400">{{ t('contactForm.notesHint') }}</span>
    </label>

    @if (formError(); as key) {
      <p class="text-sm text-rose-600">{{ t(key) }}</p>
    }

    <div class="flex justify-end gap-3 border-t border-slate-100 pt-4">
      <button
        type="button"
        (click)="cancelled.emit()"
        class="btn btn--secondary"
      >
        {{ t('common.cancel') }}
      </button>
      <button
        type="submit"
        [disabled]="saving()"
        class="btn btn--primary"
      >
        {{ saving() ? t('common.saving') : t('common.save') }}
      </button>
    </div>
  </form>
</app-modal>
