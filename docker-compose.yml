# Local development stack for project-03.
#
# Data layer:
#   - db      : PostgreSQL 16   (primary database, used by Prisma)
#   - redis   : Redis 7         (cache / sessions / job queue for reminders & follow-ups)
#   - minio   : MinIO (S3 API)  (object storage for attachments: CVs, cover letters, offer PDFs)
#   - mailpit : SMTP sink       (catches every outgoing mail -> http://localhost:8025)
#
# App layer (dev-mode, hot-reload, built from Dockerfile.dev in each folder):
#   - backend  : NestJS API   (nest start --watch)  -> http://localhost:3000/api
#   - frontend : Angular app  (ng serve)             -> http://localhost:4200
#
# Usage:
#   cp .env.example .env      # then adjust the secrets
#   docker-compose up -d
#   docker-compose ps         # check health
#   docker-compose logs -f backend frontend   # follow hot-reload output
#
# Editing backend/src or frontend/src on the host reloads the running
# container automatically — no rebuild needed. A rebuild (`docker-compose up
# -d --build`) is only required after changing package.json / lockfiles or
# either Dockerfile.dev.
#
# Secrets are read from a local .env (gitignored). Sensible DEV defaults are
# provided via ${VAR:-default}, so the stack also runs without a .env — but
# you MUST set strong secrets (and an encrypted volume/disk) before any
# non-local deployment. See the "Security" note in the README.

name: project-03

services:
  db:
    image: postgres:16-alpine
    container_name: project03-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-project_03}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: project03-redis
    restart: unless-stopped
    # Password-protected + append-only file for persistence.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    environment:
      # Lets redis-cli (incl. the healthcheck) authenticate without exposing the password on the CLI.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: project03-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"        # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"    # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: project03-mailpit
    restart: unless-stopped
    # Catches every outgoing mail instead of delivering it: password-reset and
    # verification links open in the web UI, and nothing can escape to a real
    # inbox from a dev machine.
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"     # SMTP, what the backend talks to
      - "${MAILPIT_UI_PORT:-8025}:8025"       # Web UI: http://localhost:8025
    volumes:
      - mailpitdata:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: project03-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides backend/.env: inside the compose network, services reach
      # each other by service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-project_03}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379
      S3_ENDPOINT: http://minio:9000
      # S3_ENDPOINT above is the container-network hostname, used for the
      # backend's own PUT/DELETE/HEAD calls to MinIO. Presigned URLs must
      # instead be signed against an endpoint the *browser* can resolve, so
      # this is deliberately the host-mapped port, not the service name.
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      PORT: "3000"
      # tsc --watch's default fs.watch-based strategy misses some change
      # events on Docker bind mounts; polling is slower but reliable here.
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/test:/app/test
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # No health condition: the image ships no shell for a healthcheck, and a
      # mail relay that is not up yet only delays a mail, it does not break boot.
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: project03-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - frontend_node_modules:/app/node_modules
      - frontend_angular_cache:/app/.angular
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  mailpitdata:
  backend_node_modules:
  frontend_node_modules:
  frontend_angular_cache:
